<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trac.king HUD</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: white;
      pointer-events: none;
    }

    /* Главный HUD в правом верхнем углу */
    .hud {
      position: fixed;
      top: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      color: #ffffff;
      text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.7);
    }

    /* Логотип Trac.king */
    .brand {
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -1px;
      margin-bottom: 4px;
      display: flex;
      align-items: baseline;
      color: #ffffff;
    }

    /* Оранжевая точка в названии */
    .brand span {
      color: #ff7700;
      font-size: 36px;
      line-height: 0;
      margin: 0 1px;
      text-shadow: 0 0 10px rgba(255, 119, 0, 0.8);
    }

    /* Блок строки с онлайн / названием сервера */
    .info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .online-text {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .online-count {
      font-weight: 800;
    }

    /* Оранжевый бэйдж сервера */
    .server-badge {
      background: rgba(255, 119, 0, 0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 3px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255, 119, 0, 0.4);
      box-shadow: 0 0 8px rgba(255, 119, 0, 0.2);
      color: #ffaa55;
    }

    .server-icon {
      width: 12px;
      height: 12px;
      fill: #ffaa55;
    }

    /* Информационная строка со статусом мира и пинга */
    .player-info {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.95;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .player-info .static-id {
      color: #ff9933;
      font-weight: 800;
    }

    /* Показ режима игры */
    .gamemode-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .gamemode-text {
      letter-spacing: 0.5px;
    }

    /* Оранжевые гильзы / паттерн-декор */
    .bullet-icon {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .bullet {
      width: 4px;
      height: 14px;
      background: linear-gradient(180deg, #ffaa55 0%, #ff7700 100%);
      border-radius: 1px 1px 0 0;
      display: inline-block;
      box-shadow: 0 0 4px rgba(255, 119, 0, 0.6);
    }

    /* Блоки ошибок и загрузки */
    .state-badge {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(18, 18, 18, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 5px;
    }

    .loading {
      color: #ffaa55;
    }

    .error {
      color: #ff5555;
      border-color: rgba(255, 85, 85, 0.4);
    }

    .updated {
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 9px;
      font-weight: 600;
      text-align: right;
    }
  </style>
</head>

<body>
  <div class="hud" id="hud">
    <!-- Шапка LOGO -->
    <div class="brand">Trac<span>.</span>king</div>

    <!-- Контейнер для данных с сервера Minecraft -->
    <div id="servers">
      <div class="state-badge loading">Загрузка WebGUI...</div>
    </div>

    <!-- Метка времени обновления -->
    <div id="updated" class="updated"></div>
  </div>

  <script type="module">
    const serversElement = document.getElementById("servers");
    const updatedElement = document.getElementById("updated");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatPing(ping) {
      return typeof ping === "number"
        ? `${Math.round(ping)} ms`
        : "—";
    }

    function renderError(message) {
      serversElement.innerHTML = `
        <div class="state-badge error">${escapeHtml(message)}</div>
      `;
    }

    function render(client) {
      if (!client) {
        serversElement.innerHTML = `
          <div class="state-badge loading">Подключение к Minecraft...</div>
        `;
        return;
      }

      const server = client.server ?? {};
      const address = server.address || "Singleplayer";
      const ping = formatPing(server.ping);
      const dimension = client.dimension || "overworld";
      const gamemode = client.gamemode || "SURVIVAL";

      serversElement.innerHTML = `
        <!-- Онлайн / Пинг и Название сервера -->
        <div class="info-row">
          <div class="online-text">
            Ping: <span class="online-count">${escapeHtml(ping)}</span>
          </div>
          <div class="server-badge" title="${escapeHtml(address)}">
            <svg class="server-icon" viewBox="0 0 24 24">
              <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M9,8A1.5,1.5 0 0,0 7.5,9.5A1.5,1.5 0 0,0 9,11A1.5,1.5 0 0,0 10.5,9.5A1.5,1.5 0 0,0 9,8M15,8A1.5,1.5 0 0,0 13.5,9.5A1.5,1.5 0 0,0 15,11A1.5,1.5 0 0,0 16.5,9.5A1.5,1.5 0 0,0 15,8M12,14C10,14 8.5,15.5 8.5,17H15.5C15.5,15.5 14,14 12,14Z"/>
            </svg>
            <span>${escapeHtml(address)}</span>
          </div>
        </div>

        <!-- Игровая информация (Мир) -->
        <div class="player-info">
          WORLD: <span class="static-id">#${escapeHtml(dimension)}</span>
        </div>

        <!-- Режим игры (Gamemode) -->
        <div class="gamemode-info">
          <span class="gamemode-text">${escapeHtml(gamemode)}</span>
          <div class="bullet-icon">
            <div class="bullet"></div>
            <div class="bullet"></div>
            <div class="bullet"></div>
          </div>
        </div>
      `;

      updatedElement.textContent =
        "Обновлено: " +
        new Date().toLocaleTimeString("ru-RU");
    }

    async function initWebGUI() {
      try {
        const webgui = await import(
          "https://esm.sh/@webgui/client"
        );

        const {
          clientStore,
          isInMod,
          isReady
        } = webgui;

        if (!isInMod()) {
          renderError(
            "HUD открыт не внутри Minecraft WebGUI"
          );
          updatedElement.textContent = "WebGUI не обнаружен";
          return;
        }

        const update = () => {
          render(clientStore.get());
        };

        clientStore.subscribe(update);
        update();

        if (!isReady(clientStore.get())) {
          serversElement.innerHTML = `
            <div class="state-badge loading">
              Получение данных Minecraft...
            </div>
          `;
        }
      } catch (error) {
        console.error("WebGUI initialization error:", error);

        renderError(
          "Не удалось подключиться к WebGUI"
        );

        updatedElement.textContent =
          "Ошибка загрузки API";
      }
    }

    initWebGUI();
  </script>
</body>
</html>
