<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trac.king HUD</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: white;
      pointer-events: none;
    }

    /* === ВЕРХНИЙ ПРАВЫЙ УГОЛ: LOGO + ONLINE === */
    .hud-top-right {
      position: fixed;
      top: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      color: #ffffff;
      text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.7);
    }

    .brand {
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -1px;
      margin-bottom: 4px;
      display: flex;
      align-items: baseline;
      color: #ffffff;
    }

    .brand span {
      color: #ff7700;
      font-size: 36px;
      line-height: 0;
      margin: 0 1px;
      text-shadow: 0 0 10px rgba(255, 119, 0, 0.8);
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .online-text {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .online-count {
      font-weight: 800;
    }

    .server-badge {
      background: rgba(255, 119, 0, 0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 3px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255, 119, 0, 0.4);
      box-shadow: 0 0 8px rgba(255, 119, 0, 0.2);
      color: #ffaa55;
    }

    .server-icon {
      width: 12px;
      height: 12px;
      fill: #ffaa55;
    }

    /* === ЛЕВЫЙ НИЖНИЙ УГОЛ: ПОГОДА, ВРЕМЯ, ДЕНЬГИ === */
    .hud-bottom-left {
      position: fixed;
      bottom: 25px;
      left: 25px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      color: #ffffff;
      text-shadow: 0px 2px 5px rgba(0, 0, 0, 0.85);
      font-weight: 700;
    }

    /* Погода */
    .weather-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      letter-spacing: 0.2px;
    }

    .weather-temp {
      font-weight: 800;
    }

    .weather-icon {
      font-size: 16px;
    }

    .weather-desc {
      font-weight: 700;
      opacity: 0.95;
    }

    /* Время и дата */
    .time-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .current-time {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .current-date {
      font-size: 14px;
      font-weight: 700;
      opacity: 0.8;
    }

    .day-of-week {
      font-size: 15px;
      font-weight: 700;
      opacity: 0.7;
      margin-bottom: 8px;
    }

    /* Баланс / Деньги */
    .money-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .money-icon {
      width: 18px;
      height: 18px;
      fill: #ffffff;
      opacity: 0.9;
    }

    .bank-row {
      margin-top: -2px;
    }

    /* Индикаторы ошибок и загрузки */
    .state-badge {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(18, 18, 18, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 5px;
    }

    .loading { color: #ffaa55; }
    .error { color: #ff5555; border-color: rgba(255, 85, 85, 0.4); }
  </style>
</head>

<body>
  <!-- Правый верхний угол -->
  <div class="hud-top-right">
    <div class="brand">Trac<span>.</span>king</div>
    <div id="servers">
      <div class="state-badge loading">Загрузка WebGUI...</div>
    </div>
  </div>

  <!-- Левый нижний угол (Виджет Majestic RP) -->
  <div class="hud-bottom-left">
    <!-- Погода -->
    <div class="weather-row">
      <span class="weather-temp" id="temp-val">+ 21°</span>
      <span class="weather-icon" id="weather-icon">🌤️</span>
      <span class="weather-desc" id="weather-desc">Облачно</span>
    </div>

    <!-- Время и дата -->
    <div class="time-row">
      <span class="current-time" id="clock-time">00:00</span>
      <span class="current-date" id="clock-date">01.01.2026</span>
    </div>
    <div class="day-of-week" id="clock-day">Понедельник</div>

    <!-- Наличные (0$ для теста) -->
    <div class="money-row">
      <svg class="money-icon" viewBox="0 0 24 24">
        <path d="M5 6h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm0 2v8h14V8H5zm7 1a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
      </svg>
      <span id="cash-amount">$0</span>
    </div>

    <!-- Карта / Банк (0$ для теста) -->
    <div class="money-row bank-row">
      <svg class="money-icon" viewBox="0 0 24 24">
        <path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
      </svg>
      <span id="bank-amount">$0</span>
    </div>
  </div>

  <script type="module">
    const serversElement = document.getElementById("servers");

    // Функция обновления часов реального времени
    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-time').textContent = `${hours}:${minutes}`;

      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      document.getElementById('clock-date').textContent = `${day}.${month}.${year}`;

      const daysOfWeek = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
      document.getElementById('clock-day').textContent = daysOfWeek[now.getDay()];
    }

    setInterval(updateClock, 1000);
    updateClock();

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderError(message) {
      serversElement.innerHTML = `
        <div class="state-badge error">${escapeHtml(message)}</div>
      `;
    }

    function render(client) {
      if (!client) {
        serversElement.innerHTML = `
          <div class="state-badge loading">Подключение...</div>
        `;
        return;
      }

      const server = client.server ?? {};
      const address = server.address || "Singleplayer";
      const onlinePlayers = server.players?.online ?? "—";

      // Обновляем правый верхний угол
      serversElement.innerHTML = `
        <div class="info-row">
          <div class="online-text">
            Online: <span class="online-count">${escapeHtml(onlinePlayers)}</span>
          </div>
          <div class="server-badge" title="${escapeHtml(address)}">
            <svg class="server-icon" viewBox="0 0 24 24">
              <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M9,8A1.5,1.5 0 0,0 7.5,9.5A1.5,1.5 0 0,0 9,11A1.5,1.5 0 0,0 10.5,9.5A1.5,1.5 0 0,0 9,8M15,8A1.5,1.5 0 0,0 13.5,9.5A1.5,1.5 0 0,0 15,11A1.5,1.5 0 0,0 16.5,9.5A1.5,1.5 0 0,0 15,8M12,14C10,14 8.5,15.5 8.5,17H15.5C15.5,15.5 14,14 12,14Z"/>
            </svg>
            <span>${escapeHtml(address)}</span>
          </div>
        </div>
      `;

      // Динамическая обработка игровой погоды Minecraft из WebGUI
      if (client.world) {
        const isRaining = client.world.isRaining;
        const isThundering = client.world.isThundering;

        let temp = "+ 21°";
        let icon = "🌤️";
        let desc = "Облачно";

        if (isThundering) {
          temp = "+ 14°";
          icon = "⛈️";
          desc = "Гроза";
        } else if (isRaining) {
          temp = "+ 16°";
          icon = "🌧️";
          desc = "Дождь";
        } else {
          temp = "+ 22°";
          icon = "☀️";
          desc = "Ясно";
        }

        document.getElementById("temp-val").textContent = temp;
        document.getElementById("weather-icon").textContent = icon;
        document.getElementById("weather-desc").textContent = desc;
      }
    }

    async function initWebGUI() {
      try {
        const webgui = await import(
          "https://esm.sh/@webgui/client"
        );

        const { clientStore, isInMod, isReady } = webgui;

        if (!isInMod()) {
          renderError("HUD открыт не внутри Minecraft WebGUI");
          return;
        }

        const update = () => {
          render(clientStore.get());
        };

        clientStore.subscribe(update);
        update();

        if (!isReady(clientStore.get())) {
          serversElement.innerHTML = `
            <div class="state-badge loading">Получение данных...</div>
          `;
        }
      } catch (error) {
        console.error("WebGUI initialization error:", error);
        renderError("Ошибка подключения WebGUI");
      }
    }

    initWebGUI();
  </script>
</body>
</html>
