<body>
    <div class="hud">
        <div class="brand">Trac<span>.king</span></div>
        <div class="subtitle">Server status</div>

        <div id="servers" class="servers">
            <div class="loading">Загрузка серверов...</div>
        </div>

        <div id="updated" class="updated"></div>
    </div>

    <script>
        const API_URL = "https://example.com/api/servers";
        const UPDATE_INTERVAL = 10000;

        const serversElement = document.getElementById("servers");
        const updatedElement = document.getElementById("updated");

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function renderServers(servers) {
            if (!Array.isArray(servers) || servers.length === 0) {
                serversElement.innerHTML =
                    '<div class="loading">Нет серверов</div>';
                return;
            }

            serversElement.innerHTML = servers.map(server => {
                const online = Boolean(server.online);
                const players = Number(server.players || 0);
                const maxPlayers = Number(server.maxPlayers || 0);

                return `
                    <div class="server ${online ? "online" : "offline"}">
                        <div class="server-header">
                            <div class="server-name">
                                ${escapeHtml(server.name || "Unknown")}
                            </div>

                            <div class="status">
                                <div class="status-dot"></div>
                                <span>${online ? "ONLINE" : "OFFLINE"}</span>
                            </div>
                        </div>

                        <div class="server-info">
                            <span>
                                ${online ? "Игроки" : "Сервер недоступен"}
                            </span>

                            ${
                                online
                                    ? `<span class="players">
                                        ${players}${maxPlayers ? " / " + maxPlayers : ""}
                                    </span>`
                                    : ""
                            }
                        </div>
                    </div>
                `;
            }).join("");
        }

        async function updateServers() {
            try {
                const response = await fetch(API_URL, {
                    method: "GET",
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                renderServers(data.servers);

                updatedElement.textContent =
                    "Обновлено: " +
                    new Date().toLocaleTimeString("ru-RU");

            } catch (error) {
                console.error("[Trac.king]", error);

                serversElement.innerHTML =
                    '<div class="error">Не удалось получить статус серверов</div>';

                updatedElement.textContent = "Ошибка подключения";
            }
        }

        updateServers();
        setInterval(updateServers, UPDATE_INTERVAL);
    </script>
</body>
