<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trac.king HUD</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: white;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      pointer-events: none;
    }

    .hud {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 285px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand {
      text-align: right;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }

    .brand span {
      color: #7c5cff;
    }

    .subtitle {
      margin-top: -7px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-align: right;
      text-transform: uppercase;
    }

    .servers {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .server,
    .loading,
    .error {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: linear-gradient(
        135deg,
        rgba(20, 20, 28, 0.88),
        rgba(10, 10, 15, 0.82)
      );
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .server {
      min-height: 58px;
      padding: 10px 12px;
    }

    .server-header,
    .server-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .server-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      color: rgba(85, 229, 138, 0.9);
      font-size: 10px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #55e58a;
      box-shadow: 0 0 8px rgba(85, 229, 138, 0.8);
    }

    .server-info {
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 10px;
    }

    .players {
      color: rgba(255, 255, 255, 0.68);
    }

    .loading,
    .error {
      padding: 14px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      text-align: center;
    }

    .error {
      color: rgba(255, 130, 130, 0.85);
    }

    .updated {
      color: rgba(255, 255, 255, 0.28);
      font-size: 9px;
      text-align: right;
    }
  </style>
</head>

<body>
  <div class="hud">
    <div class="brand">Trac<span>.king</span></div>
    <div class="subtitle">Server status</div>

    <div id="servers" class="servers">
      <div class="loading">Загрузка серверов...</div>
    </div>

    <div id="updated" class="updated"></div>
  </div>

  <script type="module">
    const serversElement = document.getElementById("servers");
    const updatedElement = document.getElementById("updated");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatPing(ping) {
      return typeof ping === "number"
        ? `${Math.round(ping)} ms`
        : "—";
    }

    function renderError(message) {
      serversElement.innerHTML = `
        <div class="error">${escapeHtml(message)}</div>
      `;
    }

    function render(client) {
      if (!client) {
        serversElement.innerHTML = `
          <div class="loading">Подключение к Minecraft...</div>
        `;
        return;
      }

      const server = client.server ?? {};
      const address = server.address || "Minecraft server";
      const ping = formatPing(server.ping);
      const dimension = client.dimension || "—";
      const gamemode = client.gamemode || "—";

      serversElement.innerHTML = `
        <div class="server">
          <div class="server-header">
            <div class="server-name" title="${escapeHtml(address)}">
              ${escapeHtml(address)}
            </div>

            <div class="status">
              <span class="status-dot"></span>
              <span>ONLINE</span>
            </div>
          </div>

          <div class="server-info">
            <span>Ping</span>
            <span class="players">${escapeHtml(ping)}</span>
          </div>

          <div class="server-info">
            <span>Мир</span>
            <span class="players">${escapeHtml(dimension)}</span>
          </div>

          <div class="server-info">
            <span>Режим</span>
            <span class="players">${escapeHtml(gamemode)}</span>
          </div>
        </div>
      `;

      updatedElement.textContent =
        "Обновлено: " +
        new Date().toLocaleTimeString("ru-RU");
    }

    async function initWebGUI() {
      try {
        const webgui = await import(
          "https://esm.sh/@webgui/client"
        );

        const {
          clientStore,
          isInMod,
          isReady
        } = webgui;

        if (!isInMod()) {
          renderError(
            "HUD открыт не внутри Minecraft WebGUI"
          );
          updatedElement.textContent = "WebGUI не обнаружен";
          return;
        }

        const update = () => {
          render(clientStore.get());
        };

        clientStore.subscribe(update);
        update();

        if (!isReady(clientStore.get())) {
          serversElement.innerHTML = `
            <div class="loading">
              Получение данных Minecraft...
            </div>
          `;
        }
      } catch (error) {
        console.error("WebGUI initialization error:", error);

        renderError(
          "Не удалось подключиться к WebGUI"
        );

        updatedElement.textContent =
          "Ошибка загрузки API";
      }
    }

    initWebGUI();
  </script>
</body>
</html>
